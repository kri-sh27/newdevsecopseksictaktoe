apiVersion: v1
kind: Namespace
metadata:
  name: tic-tac-toe

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tic-tac-toe
  namespace: tic-tac-toe

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tic-tac-toe

  template:
    metadata:
      labels:
        app: tic-tac-toe

    spec:
      containers:
        - name: tic-tac-toe
          image: public.ecr.aws/l6m2t8p7/docker-2048:latest

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: tic-tac-toe
  namespace: tic-tac-toe

spec:
  selector:
    app: tic-tac-toe

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tic-tac-toe
  namespace: tic-tac-toe

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: tic-tac-toe
                port:
                  number: 80